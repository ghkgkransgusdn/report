// ===================================================================
// STORAGE — uses window.storage if in Claude artifact, else localStorage
// ===================================================================
const STORAGE_KEY = 'snow_melter_research_v1';

const hasClaudeStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function loadData() {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value) return deepMerge(EMPTY_DATA, JSON.parse(res.value));
    } else if (typeof localStorage !== 'undefined') {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return deepMerge(EMPTY_DATA, JSON.parse(raw));
    }
  } catch (e) { /* fresh start */ }
  return EMPTY_DATA;
}

async function saveData(data) {
  try {
    const json = JSON.stringify(data);
    if (hasClaudeStorage) {
      await window.storage.set(STORAGE_KEY, json);
    } else if (typeof localStorage !== 'undefined') {
      localStorage.setItem(STORAGE_KEY, json);
    } else {
      return false;
    }
    return true;
  } catch (e) {
    console.error('Save failed:', e);
    return false;
  }
}

async function clearStorage() {
  try {
    if (hasClaudeStorage) await window.storage.delete(STORAGE_KEY);
    else if (typeof localStorage !== 'undefined') localStorage.removeItem(STORAGE_KEY);
  } catch (e) { /* ignore */ }
}

function deepMerge(target, source) {
  if (Array.isArray(target)) {
    return Array.isArray(source) ? source : target;
  }
  if (typeof target === 'object' && target !== null) {
    const result = { ...target };
    if (typeof source === 'object' && source !== null) {
      for (const k in source) {
        if (k in target) result[k] = deepMerge(target[k], source[k]);
        else result[k] = source[k];
      }
    }
    return result;
  }
  return source !== undefined ? source : target;
}
// Immutable update helper for nested paths
function update(obj, path, value) {
  if (path.length === 0) return value;
  const [head, ...rest] = path;
  if (Array.isArray(obj)) {
    const copy = [...obj];
    copy[head] = update(obj[head], rest, value);
    return copy;
  }
  return { ...obj, [head]: update(obj[head] || {}, rest, value) };
}

const WATER_SPECIFIC_HEAT = 4.184; // J/g·℃

function calcHeat(solute_mass, water_mass, temp_change) {
  const wm = parseFloat(water_mass);
  const tc = parseFloat(temp_change);
  if (isNaN(wm) || isNaN(tc)) return '';
  const q = WATER_SPECIFIC_HEAT * wm * tc;
  return q.toFixed(1) + ' J';
}

function calcWeightedAverage(scoring, candidate) {
  // Sum of (weight * score) / total weight
  let totalWeight = 0;
  let weightedSum = 0;
  for (const key of ['fp', 'melt', 'env', 'economic']) {
    const w = parseFloat(scoring[key].weight);
    const s = parseFloat(scoring[key][candidate]);
    if (!isNaN(w) && !isNaN(s)) {
      totalWeight += w;
      weightedSum += w * s;
    }
  }
  if (totalWeight === 0) return '';
  return (weightedSum / totalWeight * (totalWeight === 100 ? 1 : 100/totalWeight)).toFixed(2);
}

function sumWeights(scoring) {
  let total = 0;
  for (const key of ['fp', 'melt', 'env', 'economic']) {
    const w = parseFloat(scoring[key].weight);
    if (!isNaN(w)) total += w;
  }
  return total;
}

function sumMatrixWeights(matrix) {
  let total = 0;
  for (const row of matrix) {
    const w = parseFloat(row.weight);
    if (!isNaN(w)) total += w;
  }
  return total;
}

// ===================================================================
// CHARTS (Chart.js)
// ===================================================================
function useChart(ref, configRef, deps) {
  const chartInstance = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const config = configRef();
    if (chartInstance.current) {
      chartInstance.current.data = config.data;
      chartInstance.current.options = config.options;
      chartInstance.current.update();
    } else {
      chartInstance.current = new Chart(ref.current, config);
    }
  }, deps);
  useEffect(() => () => {
    if (chartInstance.current) {
      chartInstance.current.destroy();
      chartInstance.current = null;
    }
  }, []);
  return chartInstance;
}

      { key: 'C', label: '후보 C' + (names.C ? ` (${names.C})` : '') },
      { key: 'D', label: '후보 D' + (names.D ? ` (${names.D})` : '') },
    ];
    for (const r of rows) {
      const vals = (data[r.key] || []).map(v => v === '' || v == null ? null : parseFloat(v));
      if (vals.some(v => v != null && !isNaN(v))) {
        datasets.push({
          label: r.label,
          data: vals,
          borderColor: CANDIDATE_COLORS[r.key],
          backgroundColor: CANDIDATE_COLORS[r.key] + '33',
          tension: 0.2,
          spanGaps: true,
        });
      }
    }
    return {
      type: 'line',
      data: { labels: timeLabels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: '냉각 곡선 (시간 vs 온도)', font: { size: 14 } },
          legend: { position: 'top' },
        },
        scales: {
          x: { title: { display: true, text: '시간 (초)' } },
          y: { title: { display: true, text: '온도 (℃)' } },
        },
      },
    };
  }, [JSON.stringify(data), JSON.stringify(names)]);

  return (
    <div className="chart-box" style={{height: '320px'}}>
      <canvas ref={ref}></canvas>
    </div>
  );
}

function RadarChart({ scoring }) {
  const ref = useRef();

  useChart(ref, () => {
    const labels = ['어는점 내림 효과', '융해 효율', '환경 영향', '경제성'];
    const datasets = [];
    for (const cand of ['A', 'B', 'C', 'D', 'mixed']) {
      const values = ['fp', 'melt', 'env', 'economic'].map(k => {
        const v = parseFloat(scoring[k][cand]);
        return isNaN(v) ? 0 : v;
      });
      if (values.some(v => v > 0)) {
        datasets.push({
          label: cand === 'mixed' ? '혼합 처방' : '후보 ' + cand,
          data: values,
          borderColor: CANDIDATE_COLORS[cand],
          backgroundColor: CANDIDATE_COLORS[cand] + '44',
          borderWidth: 2,
        });
      }
    }
    return {
      type: 'radar',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: '평가 매트릭스 레이더 차트', font: { size: 14 } },
          legend: { position: 'top' },
        },
        scales: {
          r: { beginAtZero: true, min: 0, max: 5,
            ticks: { stepSize: 1 } },
        },
      },
    };
  }, [JSON.stringify(scoring)]);

  return (
    <div className="chart-box" style={{height: '380px'}}>
      <canvas ref={ref}></canvas>
    </div>
  );
}

// Helpers to grab chart canvas as base64 image (for docx export)
function getChartImageDataURL(canvasEl) {
  if (!canvasEl) return null;
  try { return canvasEl.toDataURL('image/png'); }
  catch (e) { return null; }
}

// ===================================================================
// DOCX GENERATION
// ===================================================================
const PRIMARY_HEX = '1F4E79';
const GRAY_HEX = 'F2F2F2';
const BORDER_HEX = '999999';

function D() { return window.docx; }

function mTR(text, opts = {}) {
  return new (D().TextRun)({
    text: String(text || ''),
    bold: !!opts.bold,
    italics: !!opts.italics,
    color: opts.color || '000000',
    size: opts.size || 20,
    font: 'Malgun Gothic',
  });
}

function mP(children, opts = {}) {
  const { Paragraph, AlignmentType } = D();
  const cfg = {
    children: Array.isArray(children) ? children : [children],
    spacing: { before: opts.before || 0, after: opts.after == null ? 80 : opts.after, line: opts.line || 280 },
  };
  if (opts.alignment === 'center') cfg.alignment = AlignmentType.CENTER;
  if (opts.alignment === 'right') cfg.alignment = AlignmentType.RIGHT;
  if (opts.pageBreakBefore) cfg.pageBreakBefore = true;
  if (opts.shading) cfg.shading = opts.shading;
  if (opts.border) cfg.border = opts.border;
  return new Paragraph(cfg);
}

function mH1(text) {
  const { ShadingType } = D();
  return mP(mTR(text, { bold: true, color: 'FFFFFF', size: 32 }), {
    shading: { type: ShadingType.CLEAR, fill: PRIMARY_HEX, color: 'auto' },
    before: 480, after: 240,
  });
}
function mH2(text) {
  const { BorderStyle } = D();
  return mP(mTR(text, { bold: true, color: PRIMARY_HEX, size: 26 }), {
    before: 320, after: 160,
    border: { bottom: { style: BorderStyle.SINGLE, size: 12, color: PRIMARY_HEX, space: 1 } },
  });
}
function mH3(text) {
  return mP(mTR(text, { bold: true, color: PRIMARY_HEX, size: 22 }), { before: 200, after: 100 });
}
function mHint(text) { return mP(mTR('💡  ' + text, { italics: true, color: '7F7F7F', size: 18 }), { before: 60, after: 80 }); }
function mBullet(text) { return mP(mTR('▶ ' + text, { bold: true, color: '333333', size: 22 }), { before: 200, after: 100 }); }
function mNote(text) { return mP(mTR(text, { italics: true, color: '595959', size: 18 }), { before: 40, after: 120 }); }
function mTxt(text) { return mP(mTR(text)); }

function mC(content, opts = {}) {
  const { TableCell, ShadingType, BorderStyle, WidthType, VerticalAlign } = D();
  const b = { style: BorderStyle.SINGLE, size: 4, color: BORDER_HEX };
  const cfg = {
    children: Array.isArray(content) ? content : [content],
    borders: { top: b, bottom: b, left: b, right: b },
    margins: { top: 80, bottom: 80, left: 120, right: 120 },
    verticalAlign: VerticalAlign.CENTER,
  };
  if (opts.width) cfg.width = { size: opts.width, type: WidthType.DXA };
  if (opts.shading) cfg.shading = { type: ShadingType.CLEAR, fill: opts.shading, color: 'auto' };
  if (opts.colSpan) cfg.columnSpan = opts.colSpan;
  return new TableCell(cfg);
}
function mHC(text, w) { return mC(mP(mTR(text, { bold: true, color: 'FFFFFF' }), { alignment: 'center', after: 0 }), { width: w, shading: PRIMARY_HEX }); }
function mLC(text, w, opts = {}) { return mC(mP(mTR(text, { bold: true }), { alignment: opts.left ? 'left' : 'center', after: 0 }), { width: w, shading: GRAY_HEX, colSpan: opts.colSpan }); }
function mDC(text, w) {
  const lines = String(text || '').split('\n');
  return mC(lines.map(l => mP(mTR(l), { after: 0 })), { width: w });
}
function mT(rows, totalW = 9360) {
  const { Table, WidthType } = D();
  return new Table({ rows, width: { size: totalW, type: WidthType.DXA } });
}
function mR(cells) { return new (D().TableRow)({ children: cells }); }

function dataURLToBytes(dataURL) {
  if (!dataURL) return null;
  try {
    const base64 = dataURL.split(',')[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  } catch (e) { return null; }
}
function mImg(dataURL, w = 400, h = 280) {
  const bytes = dataURLToBytes(dataURL);
  if (!bytes) return null;
  const { ImageRun, Paragraph, AlignmentType } = D();
  return new Paragraph({
    children: [new ImageRun({ data: bytes, transformation: { width: w, height: h } })],
    alignment: AlignmentType.CENTER,
  });
}

    mDC(calcWeightedAverage(data.part4.scoring, 'D'), 1192),
    mDC(calcWeightedAverage(data.part4.scoring, 'mixed'), 1200),
  ]));
  k.push(mT(scR));
  k.push(mNote('※ 가중 평균 = Σ (기준 점수 × 가중치) ÷ 100'));

  k.push(mH2('4-3.  결과 시각화 (레이더 차트)'));
  if (chartImgs.radar) { const img = mImg(chartImgs.radar, 480, 380); if (img) k.push(img); }
  else k.push(mT([mR([mDC('(점수 데이터 미입력)', 9360)])]));

  // Part 5
  k.push(mP(mTR(''), { pageBreakBefore: true, after: 0 }));
  k.push(mH1('Part 5.  결론 및 제안'));
  k.push(mNote('데이터에서 답을 끌어내고, 그 답이 사회에 어떻게 쓰일지 제안한다.'));

  k.push(mH2('5-1.  우리 모둠이 선정한 최적 제설제'));
  k.push(mBullet('(1) 최적 제설제 선정 결과'));
  k.push(mT([mR([mDC(data.part5.optimal, 9360)])]));
  k.push(mBullet('(2) 선정 근거'));
  k.push(mT([mR([mDC(data.part5.optimal_basis, 9360)])]));

  k.push(mH2('5-2.  사용 용도별 추천'));
  const useR = [mR([mHC('사용 환경', 2800), mHC('추천 제설제', 2400), mHC('추천 이유', 4160)])];
  data.part5.use_cases.forEach(uc => useR.push(mR([mLC(uc.env, 2800, {left:true}), mDC(uc.rec, 2400), mDC(uc.reason, 4160)])));
  k.push(mT(useR));

  k.push(mH2('5-3.  가설 검증 결과'));
  const resultMap = { supported: '☑ 지지됨    ☐ 부분 지지    ☐ 반증됨', partial: '☐ 지지됨    ☑ 부분 지지    ☐ 반증됨', refuted: '☐ 지지됨    ☐ 부분 지지    ☑ 반증됨', '': '☐ 지지됨    ☐ 부분 지지    ☐ 반증됨' };
  k.push(mT([
    mR([mLC('우리의 가설 (2-5)', 2200, {left:true}), mDC(data.part2.hypothesis_statement, 7160)]),
    mR([mLC('검증 결과', 2200, {left:true}), mDC(resultMap[data.part5.hyp_verification.result] || resultMap[''], 7160)]),
    mR([mLC('판단 근거', 2200, {left:true}), mDC(data.part5.hyp_verification.basis, 7160)]),
  ]));

  k.push(mH2('5-4.  연구의 한계'));
  k.push(mT([mR([mDC(data.part5.limitations, 9360)])]));

  k.push(mH2('5-5.  후속 연구 제안'));
  k.push(mT([mR([mDC(data.part5.future_research, 9360)])]));

  // Part 6
  k.push(mP(mTR(''), { pageBreakBefore: true, after: 0 }));
  k.push(mH1('Part 6.  참고문헌'));
  k.push(mTxt('조사·인용한 자료를 모두 정리한다. 영재원 산출물에서는 출처 정리가 평가의 큰 부분이다.'));
  k.push(mT(data.references.map((r, i) => mR([mLC(String(i+1), 800, {left:true}), mDC(r, 8560)]))));

  // Part 7
  k.push(mP(mTR(''), { pageBreakBefore: true, after: 0 }));
  k.push(mH1('Part 7.  자기 평가 및 모둠 평가'));

  k.push(mH2('7-1.  자기 평가'));
  const sf = data.part7.self;
  k.push(mT([
    mR([mLC('이름', 2400, {left:true}), mDC(sf.name, 6960)]),
    mR([mLC('내가 모둠에서 맡은 역할', 2400, {left:true}), mDC(sf.role, 6960)]),
    mR([mLC('가장 잘했다고 생각하는 부분', 2400, {left:true}), mDC(sf.did_well, 6960)]),
    mR([mLC('더 잘했어야 했던 부분', 2400, {left:true}), mDC(sf.could_improve, 6960)]),
    mR([mLC('이 프로젝트로 새로 배운 것', 2400, {left:true}), mDC(sf.learned, 6960)]),
  ]));

  k.push(mH2('7-2.  모둠 평가'));
  const ge = data.part7.group_eval;
  const check = (val, target) => val === target ? '☑' : '☐';
  const gC = [
    ['active', '모둠원들이 적극적으로 의견을 냈다'],
    ['fair', '역할 분담이 공평했다'],
    ['participate', '실험에 모두 참여했다'],
    ['helping', '어려운 일이 있을 때 서로 도왔다'],
    ['honest', '데이터 기록이 정확하고 정직했다'],
    ['contribute', '보고서·산출물 작성에 모두 기여했다'],
  ];
  const geR = [mR([mHC('평가 항목', 4360), mHC('매우 좋음', 1250), mHC('좋음', 1250), mHC('보통', 1250), mHC('미흡', 1250)])];
  gC.forEach(([kn, label]) => {
    geR.push(mR([
      mLC(label, 4360, {left:true}),
      mLC(check(ge[kn], 'excellent'), 1250),
      mLC(check(ge[kn], 'good'), 1250),
      mLC(check(ge[kn], 'fair'), 1250),
      mLC(check(ge[kn], 'poor'), 1250),
    ]));
  });
  k.push(mT(geR));

  k.push(mBullet('우리 모둠의 자랑스러운 점'));
  k.push(mT([mR([mDC(data.part7.proud, 9360)])]));
  k.push(mBullet('다음 프로젝트에서 개선하고 싶은 점'));
  k.push(mT([mR([mDC(data.part7.improvement, 9360)])]));

  // Build doc
  const doc = new Document({
    creator: '영재원',
    title: '친환경 제설제를 찾아라!',
    styles: { default: { document: { run: { font: 'Malgun Gothic', size: 20 } } } },
    sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838 }, // A4
          margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 },
        },
      },
      children: k,
    }],
  });

  return Packer.toBlob(doc);
}

// ===================================================================
// MAIN APP
// ===================================================================
const SECTIONS = [
  { id: 'cover', label: '표지·요약', comp: CoverSection },
  { id: 'part1', label: '1. 문제인식', comp: Part1Section },
  { id: 'part2', label: '2. 주제선정', comp: Part2Section },
  { id: 'part3', label: '3. 탐구활동', comp: Part3Section },
  { id: 'part4', label: '4. 결과', comp: Part4Section },
  { id: 'part5', label: '5. 결론', comp: Part5Section },
  { id: 'part6', label: '6. 참고문헌', comp: Part6Section },
  { id: 'part7', label: '7. 자기·모둠 평가', comp: Part7Section },
];

function App() {
  const [data, setData] = useState(EMPTY_DATA);
  const [section, setSection] = useState('cover');
  const [saveState, setSaveState] = useState('loaded'); // loaded, saving, saved, error
  const [downloading, setDownloading] = useState(false);
  const [downloadMsg, setDownloadMsg] = useState('');
  const saveTimerRef = useRef(null);
  const initRef = useRef(false);

  // Load on mount
  useEffect(() => {
    (async () => {
      const loaded = await loadData();
      setData(loaded);
      initRef.current = true;
      setSaveState('saved');
    })();
  }, []);

  // Autosave on change (debounced)
  useEffect(() => {
    if (!initRef.current) return;
    setSaveState('saving');
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(async () => {
      const ok = await saveData(data);
      setSaveState(ok ? 'saved' : 'error');
    }, 800);
    return () => clearTimeout(saveTimerRef.current);
  }, [data]);

  const set = useCallback((path, value) => {
    setData(d => update(d, path, value));
  }, []);

  const handleDownload = async () => {
    if (!window.docx) { alert('docx 라이브러리 로딩 실패. 페이지를 새로 고침해 주세요.'); return; }
    setDownloading(true);
    setDownloadMsg('차트 이미지 생성 중...');
    try {
      // Collect chart images
      await new Promise(r => setTimeout(r, 100)); // let UI update
      const canvases = document.querySelectorAll('.chart-box canvas');
      const chartImgs = {};
      canvases.forEach((cv, i) => {
        try {
          const url = cv.toDataURL('image/png');
          if (i === 0) chartImgs.cooling = url;
          else if (i === 1) chartImgs.melting = url;
          else if (i === 2) chartImgs.radar = url;
        } catch (e) {}
      });

      setDownloadMsg('문서 생성 중...');
      const blob = await buildDoc(data, chartImgs);

      setDownloadMsg('다운로드 시작...');
      const fname = `친환경_제설제를_찾아라_${(data.cover.group_name || '모둠').replace(/[^\w가-힣]/g, '')}.docx`;
      saveAs(blob, fname);
      setDownloadMsg('완료');
      setTimeout(() => { setDownloading(false); setDownloadMsg(''); }, 800);
    } catch (e) {
      console.error(e);
      alert('문서 생성 중 오류: ' + e.message);
      setDownloading(false);
      setDownloadMsg('');
    }
  };

  const handleReset = async () => {
    if (!confirm('모든 입력 내용을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
    setData(EMPTY_DATA);
  };

  // Compute progress
  const progress = useMemo(() => computeProgress(data), [data]);

  const currentIdx = SECTIONS.findIndex(s => s.id === section);

  return (
    <>
      <div className="topbar">
        <h1>친환경 제설제를 찾아라! — 영재원 탐구활동지</h1>
        <span className={'save-status ' + (saveState === 'saved' ? 'saved' : '')}>
          {saveState === 'saving' && '저장 중...'}
          {saveState === 'saved' && '✓ 자동 저장됨'}
          {saveState === 'error' && '⚠ 저장 실패'}
          {saveState === 'loaded' && '로딩 중...'}
        </span>
        <button className="btn btn-secondary" onClick={handleReset}>초기화</button>
        <button className="btn" onClick={handleDownload} disabled={downloading}>
          {downloading ? '생성 중...' : '📥 docx 다운로드'}
        </button>
      </div>
      <div className="nav">
        {SECTIONS.map(s => (
          <button key={s.id} className={section === s.id ? 'active' : ''} onClick={() => { setSection(s.id); window.scrollTo(0, 0); }}>
            {s.label}
          </button>
        ))}
      </div>

      <div className="container">
        <div style={{marginBottom: '20px'}}>
          <div style={{fontSize:'13px',color:'#6b7280',marginBottom:'4px'}}>작성 진행률: {progress}%</div>
          <div className="progress-bar"><div style={{width: progress + '%'}}></div></div>
        </div>

        {/* All sections mounted; inactive ones offscreen (so charts still get a real width and render).
            Charts must exist in DOM for docx export. 'inert' makes them non-focusable. */}
        {SECTIONS.map(s => {
          const Comp = s.comp;
          const isActive = section === s.id;
          return (
            <div
              key={s.id}
              style={isActive ? {} : {
                position: 'absolute',
                left: '-99999px',
                top: 0,
                width: '900px',
                pointerEvents: 'none',
              }}
              aria-hidden={!isActive}
              {...(isActive ? {} : { inert: '' })}
            >
              <Comp data={data} set={set} />
            </div>
          );
        })}

        <div style={{display:'flex',justifyContent:'space-between',marginTop:'40px',paddingTop:'20px',borderTop:'1px solid #e5e7eb'}}>
          {currentIdx > 0 ? (
            <button className="btn btn-secondary" onClick={() => { setSection(SECTIONS[currentIdx-1].id); window.scrollTo(0, 0); }}>
              ← {SECTIONS[currentIdx-1].label}
            </button>
          ) : <div />}
          {currentIdx < SECTIONS.length - 1 ? (
            <button className="btn" onClick={() => { setSection(SECTIONS[currentIdx+1].id); window.scrollTo(0, 0); }}>
              {SECTIONS[currentIdx+1].label} →
            </button>
          ) : (
            <button className="btn" onClick={handleDownload} disabled={downloading} style={{fontSize:'15px'}}>
              📥 완성 — docx 다운로드
            </button>
          )}
        </div>
      </div>

      {downloading && (
        <div className="overlay">
          <div className="overlay-box">
            <div className="spinner"></div>
            <div style={{fontWeight:'600',marginBottom:'4px'}}>문서 생성 중</div>
            <div style={{fontSize:'13px',color:'#6b7280'}}>{downloadMsg}</div>
          </div>
        </div>
      )}
    </>
  );
}

function computeProgress(data) {
  let total = 0, filled = 0;
  const visit = (obj) => {
    if (obj == null) return;
    if (typeof obj === 'string') {
      total++;
      if (obj.trim().length > 0) filled++;
    } else if (Array.isArray(obj)) {
      obj.forEach(visit);
    } else if (typeof obj === 'object') {
      for (const k in obj) visit(obj[k]);
    }
  };
  visit(data);
  return total === 0 ? 0 : Math.round(filled / total * 100);
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
